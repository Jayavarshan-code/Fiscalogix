server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large CSV uploads
    client_max_body_size 100M;

    # React SPA — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all backend routes to FastAPI
    # Covers: /api/, /ingestion/, /sla/, /execution/, /optimization/,
    #         /financial-intelligence, /health, /auth/, /admin/, etc.
    location ~ ^/(api|ingestion|sla|execution|optimization|financial-intelligence|health|auth|admin|predict|alerts|datagrid|india|reports|enterprise|confidence-studio|documents|mapping) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE — disable buffering so stream events reach the client immediately
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # Health check endpoint
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Gzip static assets
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
