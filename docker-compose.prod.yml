version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Fiscalogix — Single EC2 Production Compose
#
# Designed for a t2.micro / t3.small free-tier instance.
# RDS Postgres is used instead of a local db container (free tier eligible).
# Redis runs locally to avoid ElastiCache cost.
#
# Required env vars (set in /etc/fiscalogix.env on the EC2 host):
#   DATABASE_URL, JWT_SECRET_KEY, REDIS_URL,
#   OPENWEATHER_API_KEY, ACLED_API_KEY, ACLED_EMAIL, MARINETRAFFIC_API_KEY
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis (local, no ElastiCache needed on free tier) ────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: /etc/fiscalogix.env
    environment:
      PORT: "8000"
      WORKERS: "1"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads:/code/tmp_uploads
      - ml_models:/code/app/financial_system/ml_pipeline/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  # ── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.tasks worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    restart: unless-stopped
    env_file: /etc/fiscalogix.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads:/code/tmp_uploads
      - ml_models:/code/app/financial_system/ml_pipeline/models

  # ── React Frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # certbot SSL certs
    depends_on:
      - backend

volumes:
  redis_data:
  uploads:
  ml_models:
